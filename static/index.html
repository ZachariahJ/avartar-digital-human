<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBIRT Counselor</title>
<!-- Filled in by the server before the page is sent; the app script reads it. -->
<!--APP_CONFIG-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: #1a1a2e; height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; }

/* Two columns: the conversation, and an optional panel holding the
   tester's case card in an iframe. The panel is a SEPARATE document — see
   the sandbox note on the <iframe> below. */
.split { display: flex; height: 100vh; justify-content: center; }
.app-col { flex: 0 1 560px; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
.card-panel { flex: 0 0 460px; height: 100vh; border-left: 1px solid #0f3460; display: none; }
body.with-card .card-panel { display: block; }
.card-panel iframe { width: 100%; height: 100%; border: 0; display: block; }

/* Below the width the two columns need, fall back to
   opening the card in its own window instead of splitting the screen. */
@media (max-width: 1080px) { body.with-card .card-panel { display: none; } }

.header { position: relative; text-align: center; padding: 14px 10px; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 1.15em; color: #e94560; letter-spacing: 0.01em; }

.main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

/* The avatar, above the transcript. */
.avatar-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; flex: 0 0 auto; padding: 16px 0 10px; }
.video-container { position: relative; width: 280px; height: 280px; }
.video-container video, .video-container canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 12px; background: #111; }
/* The idle loop sits under the canvas and never stops, so returning to
   idle" is a fade of the canvas rather than a swap of a source. That is what
   makes a barge-in land on a moving, listening face instead of freezing on
   whatever half-open mouth the last decoded frame happened to be. */
#idleVideo { z-index: 0; opacity: 1; }
#stage { z-index: 1; opacity: 0; transition: opacity 0.14s ease-out; }
#stage.speaking { opacity: 1; }
/* Voice-only still uses the video elements to drive playback (an audio-only
   source fires canplay/ended exactly like an mp4), they just have nothing to
   show, so the still portrait sits on top of them. */
#portrait { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; border-radius: 12px; z-index: 2; background: #111; }
body.audio-only #portrait { display: block; }
.subtitle-bar { width: 100%; max-width: 500px; text-align: center; padding: 8px 16px; font-size: 0.95em; min-height: 32px; color: #ccc; }

/* The transcript, below the avatar. */
.chat-panel { flex: 1; display: flex; flex-direction: column; border-top: 1px solid #0f3460; min-height: 0; }
.chat-messages { flex: 1; overflow-y: auto; padding: 10px 16px; }
.msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; font-size: 0.9em; }
.msg.user { background: #0f3460; margin-left: auto; }
.msg.assistant { background: #16213e; border: 1px solid #0f3460; }
.msg .role { font-size: 0.7em; color: #888; margin-bottom: 2px; }

/* Start, stop and the typed-input toggle. */
.controls { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #0f3460; }
.controls button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8em; font-weight: 600; }
.btn-start { background: #e94560; color: white; }
.btn-start.active { background: #4ecca3; }
.btn-clear { background: #333; color: #ccc; }
.controls button:hover { opacity: 0.85; }
.controls button:active { transform: translateY(1px); }
/* Typed input, which replaces the mic controls while it is open. */
.text-input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 6px; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; font-family: inherit; font-size: 0.85em; }
.text-input::placeholder { color: #667; }
.text-input:focus { outline: none; border-color: #4ecca3; }
.text-input:disabled { opacity: 0.45; cursor: not-allowed; }

.status-bar { text-align: center; padding: 8px 5px 14px; font-size: 0.8em; color: #778; }
.btn-card { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 5px 10px; border-radius: 6px; border: 1px solid #0f3460; background: transparent; color: #99a; font-size: 0.75em; font-family: inherit; cursor: pointer; white-space: nowrap; }
body.with-card .btn-card { border-color: #e94560; color: #e94560; }
.btn-card:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="split">
<div class="app-col">

<div class="header">
  <h1>SBIRT Counselor</h1>
  <button class="btn-card" id="btnCard" type="button">Case card</button>
</div>

<div class="main">
  <div class="avatar-panel">
    <div class="video-container">
      <video id="idleVideo" muted playsinline loop></video>
      <canvas id="stage" width="512" height="512"></canvas>
      <audio id="speech" preload="auto"></audio>
      <img id="portrait" alt="">
    </div>
    <div class="subtitle-bar" id="subtitle"></div>
  </div>
  <div class="chat-panel">
    <div class="chat-messages" id="chatMessages"></div>
  </div>
</div>

<div class="controls">
  <button class="btn-start" id="btnStart">Start</button>
  <button class="btn-clear" id="btnClear">Clear</button>
  <input class="text-input" id="textInput" type="text" autocomplete="off"
         placeholder="Type your reply, then press Enter" disabled>
</div>
<div class="status-bar" id="statusBar">Click Start to begin</div>

</div><!-- /.app-col -->

<!-- The tester's case card, in its own document. Sandboxed WITHOUT
     allow-same-origin puts the frame on an opaque origin, so this page cannot
     read its DOM even by accident: card text is unreachable from the code that
     talks to the server. allow-scripts is the only capability the card needs. -->
<aside class="card-panel" id="cardPanel">
  <iframe id="cardFrame" title="Randomized Case Selection" sandbox="allow-scripts"></iframe>
</aside>

</div><!-- /.split -->

<script>
(function() {
  // Elements
  const idleVideo = document.getElementById('idleVideo');
  const stage = document.getElementById('stage');
  const speech = document.getElementById('speech');
  const stageCtx = stage.getContext('2d');
  const subtitle = document.getElementById('subtitle');
  const chatMessages = document.getElementById('chatMessages');
  const btnStart = document.getElementById('btnStart');
  const btnClear = document.getElementById('btnClear');
  const statusBar = document.getElementById('statusBar');
  const btnCard = document.getElementById('btnCard');
  const textInput = document.getElementById('textInput');
  const cardFrame = document.getElementById('cardFrame');
  const portrait = document.getElementById('portrait');

  // Injected by the server. The fallback keeps this file usable if it is ever
  // opened without that substitution having happened.
  const APP_CONFIG = window.APP_CONFIG || {};
  const VIDEO_AVATAR = APP_CONFIG.videoAvatar !== false;
  const IDLE_VIDEO_URL = APP_CONFIG.idleUrl || '/video/assets/loop.mp4';
  if (!VIDEO_AVATAR) {
    document.body.classList.add('audio-only');
    if (APP_CONFIG.portraitUrl) portrait.src = APP_CONFIG.portraitUrl;
  }
  let micActive = false;
  let userGestured = false;
  const markGesture = () => { userGestured = true; };
  document.addEventListener('pointerdown', markGesture, { once: true });
  document.addEventListener('keydown', markGesture, { once: true });
  let typing = false;           // text box focused — mic frames are held back
  let sessionEnded = false;     // server ended the session (consent declined, user
                                // aborted, or the protocol reached its close) — the
                                // next Start begins a fresh conversation

  // Per-browser session id: isolates this tab's conversation/avatar/mic on the
  // server from every other connected user. Sent on both WebSockets and all
  // HTTP calls.
  // Persist the session id in sessionStorage so a page reload rejoins the SAME
  // server session (the connect snapshot then restores the transcript) instead of
  // silently discarding the conversation. Per-tab; a new tab gets its own session.
  let SESSION_ID = sessionStorage.getItem('sid');
  if (!SESSION_ID) {
    SESSION_ID = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'sid-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem('sid', SESSION_ID);
  }
  const SID_Q = '?sid=' + encodeURIComponent(SESSION_ID);

  // Playback.
  //
  // An utterance arrives as one audio file plus a stream of JPEG frames. The
  // audio element is the clock: each animation frame draws whichever frame the
  // current playback time calls for. Nothing is muxed and no container is
  // restarted mid-utterance, so the sub-second batches the renderer emits
  // produce no seams and no clicks.
  //
  // Underneath the canvas an idle video loops continuously and is never
  // stopped. Speaking fades the canvas in over it; an interruption fades it
  // out — onto a face that is already moving, rather than a frozen frame.
  const SEG_FPS_FALLBACK = 24;
  const segQueue = [];       // announced, still filling / waiting their turn
  let playing = null;        // the segment currently on the canvas
  let drawn = null;          // last bitmap painted (so we redraw only on change)
  let responseEnded = false; // server sent video_end → idle once the queue drains

  function makeSeg(msg) {
    return {
      id: msg.id,
      audioUrl: msg.audio_url,
      fps: msg.fps || SEG_FPS_FALLBACK,
      prebuffer: msg.prebuffer || 1,
      text: msg.subtitle || '',
      frames: [],            // sparse: createImageBitmap resolves out of order
      have: 0,
      done: false,           // server sent segment_end
      dropped: false,        // flushed; ignore anything still in flight
    };
  }

  function segById(id) {
    if (playing && playing.id === id) return playing;
    for (const s of segQueue) if (s.id === id) return s;
    return null;
  }

  function dropSeg(seg) {
    seg.dropped = true;
    for (const b of seg.frames) { if (b) { try { b.close(); } catch (e) {} } }
    seg.frames.length = 0;
  }

  function isPlayingSpeech() {
    return !!playing || segQueue.length > 0;
  }

  // Frame intake.
  function handleFrame(buf) {
    const dv = new DataView(buf);
    const seg = segById(dv.getUint32(0));
    // A frame for an utterance already abandoned. The server stops sending on
    // an interruption, but whatever was in flight still arrives, and painting
    // it would put a stale face over the idle loop.
    if (!seg || seg.dropped) return;
    const idx = dv.getUint32(4);
    createImageBitmap(new Blob([new Uint8Array(buf, 8)], { type: 'image/jpeg' }))
      .then((bmp) => {
        if (seg.dropped) { try { bmp.close(); } catch (e) {} return; }
        if (!seg.frames[idx]) seg.have++;
        seg.frames[idx] = bmp;
        maybeStart();
      })
      .catch(() => {});
  }

  // Playback control.
  function maybeStart() {
    // Wait for a buffer before starting. Starting the audio cannot be undone —
    // it would run ahead of the frames and the lips would fall out of sync for
    // the rest of the utterance.
    if (playing || !segQueue.length) return;
    const seg = segQueue[0];
    if (!seg.done && seg.have < seg.prebuffer) return;
    segQueue.shift();
    playing = seg;
    drawn = null;
    subtitle.textContent = seg.text;
    if (VIDEO_AVATAR) stage.classList.add('speaking');
    speech.muted = !userGestured;
    speech.src = seg.audioUrl;
    speech.currentTime = 0;
    speech.play().catch(() => {});
  }

  function finishSegment() {
    if (playing) { dropSeg(playing); playing = null; }
    drawn = null;
    if (segQueue.length) { maybeStart(); return; }
    if (responseEnded) toIdle();
    // Hold the last frame; more of this response is still coming.
  }

  speech.addEventListener('ended', finishSegment);
  // Audio that fails to load must not leave the avatar frozen mid-response.
  speech.addEventListener('error', () => { if (playing) finishSegment(); });

  function drawTick() {
    requestAnimationFrame(drawTick);
    if (!playing || !playing.frames.length) return;
    const i = Math.floor(speech.currentTime * playing.fps);
    // Hold the previous frame rather than blanking when the renderer falls
    // momentarily behind: the audio keeps running and it catches up.
    const bmp = playing.frames[i];
    if (!bmp || bmp === drawn) return;
    if (stage.width !== bmp.width || stage.height !== bmp.height) {
      stage.width = bmp.width;
      stage.height = bmp.height;
    }
    stageCtx.drawImage(bmp, 0, 0);
    drawn = bmp;
  }
  requestAnimationFrame(drawTick);

  function toIdle() {
    stage.classList.remove('speaking');
    subtitle.textContent = '';
    responseEnded = false;
    idleVideo.play().catch(() => {});
    statusBar.textContent = micActive ? 'Ready - speak now' : 'Click Start to begin';
  }

  function startIdle() {
    idleVideo.muted = true;         // the idle loop is silent by design
    if (!idleVideo.src.endsWith(IDLE_VIDEO_URL)) idleVideo.src = IDLE_VIDEO_URL;
    idleVideo.play().catch(() => {});
    subtitle.textContent = '';
  }

  function announceSegment(msg) {
    responseEnded = false;
    segQueue.push(makeSeg(msg));
    maybeStart();
  }

  function endSegment(id) {
    const seg = segById(id);
    if (seg) seg.done = true;
    maybeStart();               // a short utterance may not have hit prebuffer
  }

  // Interruption.
  function interruptPlayback() {
    // Drop every buffered frame and queued utterance, cut the audio, and fade
    // back to the idle loop. Because that loop has been running underneath the
    // whole time, this dissolves onto a moving face instead of cutting to a
    // still one caught mid-word.
    for (const s of segQueue) dropSeg(s);
    segQueue.length = 0;
    if (playing) { dropSeg(playing); playing = null; }
    drawn = null;
    try {
      speech.pause();
      speech.removeAttribute('src');
      speech.load();            // release the buffered audio, don't just stop it
    } catch (e) {}
    toIdle();
  }


  startIdle();

  // Server messages.
  let stateWs = null;

  function connectStateWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    stateWs = new WebSocket(proto + '//' + location.host + '/ws/state' + SID_Q);
    // One socket carries both control messages and video frames.
    stateWs.binaryType = 'arraybuffer';
    stateWs.onopen = () => console.log('[State] WS connected');
    stateWs.onclose = () => {
      console.log('[State] WS disconnected, reconnecting...');
      setTimeout(connectStateWS, 2000);
    };
    stateWs.onmessage = (e) => {
      if (typeof e.data === 'string') handleStateMessage(JSON.parse(e.data));
      else handleFrame(e.data);
    };
  }

  let chatState = [];   // [{role, content}] mirror of the server-side chat

  function handleStateMessage(msg) {
    if (msg.type === 'chat') {
      applyChatDelta(msg);
    } else if (msg.type === 'segment') {
      announceSegment(msg);
      statusBar.textContent = 'Speaking: ' + (msg.subtitle || '').slice(0, 60);
    } else if (msg.type === 'segment_end') {
      endSegment(msg.id);
    } else if (msg.type === 'flush') {
      // Sent the moment speech is detected rather than on the next poll, so it
      // arrives ahead of the state change below. Acting on it here is what
      // makes the interruption feel immediate.
      interruptPlayback();
      statusBar.textContent = 'Listening...';
    } else if (msg.type === 'video_end') {
      // The response is complete. What is buffered still plays out, and the
      // player returns to idle by itself once it drains.
      responseEnded = true;
      if (!isPlayingSpeech()) toIdle();
    } else if (msg.type === 'state') {
      const s = msg.state || 'idle';
      if (s === 'listening') {
        // They have started speaking; stop the current answer.
        interruptPlayback();
        statusBar.textContent = 'Listening...';
      }
      else if (s === 'processing') statusBar.textContent = 'Processing...';
      else if (s === 'speaking') { /* keep current subtitle status */ }
      else {
        // The server finishes before the browser does, so announcing readiness
        // here would be premature while audio is still playing. If it is,
        // playback sets it once it drains.
        if (!isPlayingSpeech()) {
          statusBar.textContent = micActive ? 'Ready - speak now' : 'Click Start to begin';
        }
      }
    } else if (msg.type === 'reset') {
      chatState = [];
      chatMessages.innerHTML = '';
      interruptPlayback();
      statusBar.textContent = 'Click Start to begin';
    } else if (msg.type === 'stop') {
      // The session is over. Stop capturing and reset the controls, but leave
      // playback alone so the closing line finishes; cutting somebody off on
      // the goodbye is worse than a moment of dead air.
      sessionEnded = true;
      if (micActive) {
        stopMic();
        micActive = false;
        btnStart.textContent = 'Start';
        btnStart.classList.remove('active');
      }
      // Closed even if the mic was never on. The session is over server-side,
      // so anything typed now earns only the "already complete" reply.
      disableTextInput();
    }
  }

  function makeMsgNode(m) {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.dataset.role = m.role;
    const roleDiv = document.createElement('div');
    roleDiv.className = 'role';
    roleDiv.textContent = m.role === 'user' ? 'You' : 'Assistant';
    div.appendChild(roleDiv);
    div.appendChild(document.createTextNode(m.content));  // lastChild = content text
    return div;
  }

  // Apply an incremental transcript update. The server sends only the changed
  // tail, and it is reconciled in place: a message still streaming has its text
  // updated on the existing node rather than being replaced, which avoids
  // flicker and does not wipe a selection the reader has made. Scroll position
  // is left alone unless they were already at the bottom.
  function applyChatDelta(msg) {
    const from = msg.from | 0;
    const atBottom = chatMessages.scrollTop + chatMessages.clientHeight
                     >= chatMessages.scrollHeight - 40;
    chatState.length = from;
    for (const m of (msg.msgs || [])) chatState.push(m);
    while (chatMessages.children.length > chatState.length) {
      chatMessages.removeChild(chatMessages.lastChild);
    }
    for (let i = from; i < chatState.length; i++) {
      const m = chatState[i];
      const node = chatMessages.children[i];
      if (node && node.dataset.role === m.role) {
        node.lastChild.textContent = m.content;           // update in place
      } else if (node) {
        chatMessages.replaceChild(makeMsgNode(m), node);
      } else {
        chatMessages.appendChild(makeMsgNode(m));
      }
    }
    if (atBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  connectStateWS();

  // Microphone capture.
  let audioWs = null;
  let audioCtx = null;
  let mediaStream = null;
  let micSource = null;
  let micNode = null;
  let micSink = null;

  function connectAudioWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    audioWs = new WebSocket(proto + '//' + location.host + '/ws/audio' + SID_Q);
    audioWs.binaryType = 'arraybuffer';
    audioWs.onopen = () => console.log('[Audio] WS connected');
    audioWs.onclose = () => {
      console.log('[Audio] WS disconnected, reconnecting...');
      if (micActive) setTimeout(connectAudioWS, 2000);
    };
  }

  async function startMic() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          // exact rather than ideal, because echo cancellation is load-bearing:
          // the mic stays open while the avatar talks, and without cancellation
          // the avatar interrupts itself. As a hint, a browser could hand back
          // an uncancelled stream and nothing here could detect it; as a
          // requirement, the failure is loud and arrives before the session.
          echoCancellation: { exact: true },
          noiseSuppression: { ideal: true },
          // Off, because the server decides who is talking to it by how loud
          // they are relative to the room (see modules/vad.py). Automatic gain
          // is the one thing that destroys that comparison: in a quiet library
          // it winds the gain up until the people at the next table are as loud
          // as the user. Requested as a hint rather than exactly, since not
          // every browser exposes the control — the ambient estimate still
          // tracks a stream that has AGC forced on, just less sharply.
          autoGainControl: { ideal: false },
        }
      });

      // The constraint above catches a browser that cannot comply. Logging what
      // was actually applied catches everything else.
      const settings = mediaStream.getAudioTracks()[0].getSettings();
      console.log('[Audio] echoCancellation:', settings.echoCancellation,
                  ' noiseSuppression:', settings.noiseSuppression,
                  ' autoGainControl:', settings.autoGainControl);
      if (settings.echoCancellation === false) {
        console.warn('[Audio] echo cancellation is OFF — the avatar will hear itself');
      }
      if (settings.autoGainControl === true) {
        console.warn('[Audio] automatic gain control is ON — background voices will '
                     + 'be levelled up toward yours, so far-field rejection is weaker');
      }

      audioCtx = new AudioContext({ sampleRate: 16000 });
      const ctxSR = audioCtx.sampleRate;
      console.log('[Audio] AudioContext sample rate:', ctxSR);
      if (ctxSR !== 16000) {
        console.error('[Audio] expected 16000, got', ctxSR);
        alert('Audio init failed: sample rate ' + ctxSR);
        return false;
      }

      await audioCtx.audioWorklet.addModule('/static/mic-worklet.js');
      micNode = new AudioWorkletNode(audioCtx, 'mic-capture', {
        numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
      });
      micNode.port.onmessage = (e) => {
        if (typing) return;
        if (audioWs && audioWs.readyState === WebSocket.OPEN) audioWs.send(e.data.buffer);
      };

      micSource = audioCtx.createMediaStreamSource(mediaStream);
      micSource.connect(micNode);
      // A worklet only runs while something downstream pulls from it, so it has
      // to reach the destination — but through a silenced gain node, or the
      // microphone would come straight back out of the speakers.
      micSink = audioCtx.createGain();
      micSink.gain.value = 0;
      micNode.connect(micSink);
      micSink.connect(audioCtx.destination);

      connectAudioWS();
      return true;
    } catch (err) {
      console.error('[Audio] Failed:', err);
      if (err.name === 'OverconstrainedError') {
        alert('This browser or microphone cannot do echo cancellation, which this '
            + 'app needs in order to hear you over the avatar. Try Chrome, or headphones.');
      } else {
        alert('Microphone access failed: ' + err.message);
      }
      return false;
    }
  }

  function stopMic() {
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micNode) { micNode.port.onmessage = null; micNode.disconnect(); micNode = null; }
    if (micSink) { micSink.disconnect(); micSink = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioWs) { audioWs.close(); audioWs = null; }
  }

  // Controls.
  btnStart.addEventListener('click', async () => {
    if (!micActive) {
      // The previous session ended, so clear the server's conversation before
      // starting; otherwise the greeting does not fire again.
      if (sessionEnded) {
        sessionEnded = false;
        await fetch('/api/reset' + SID_Q, { method: 'POST' });
      }

      const resp = await fetch('/api/toggle' + SID_Q, { method: 'POST' });
      const data = await resp.json();
      if (data.mic === 'on') {
        const ok = await startMic();
        if (ok) {
          micActive = true;
          btnStart.textContent = 'Stop';
          btnStart.classList.add('active');
          statusBar.textContent = 'Listening…';
          textInput.disabled = false;
          // Autoplay policy: unmuting is only permitted after an interaction.
          speech.muted = false;
          // Greet only now that the mic is confirmed live. Tying this to the
          // toggle instead would also greet on a denied mic.
          fetch('/api/greet' + SID_Q, { method: 'POST' });
        } else {
          // Permission refused, so undo the server-side toggle; leaving it on
          // would let a later request greet into a session with no microphone.
          await fetch('/api/toggle' + SID_Q, { method: 'POST' });
        }
      }
    } else {
      await fetch('/api/toggle' + SID_Q, { method: 'POST' });
      stopMic();
      interruptPlayback();          // Stop actually stops the avatar mid-response
      micActive = false;
      btnStart.textContent = 'Start';
      btnStart.classList.remove('active');
      disableTextInput();
      statusBar.textContent = 'Stopped';
    }
  });

  // Typed input, available only while a session is live so that a typed turn
  // always lands in one that has already greeted. The message is not drawn
  // locally: it comes back through the transcript update like a spoken one, so
  // there is only ever one source for what is on screen.
  function disableTextInput() {
    typing = false;
    textInput.value = '';
    textInput.disabled = true;
    textInput.blur();
  }

  function sendText() {
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = '';
    interruptPlayback();          // typing barges in, like speaking over the avatar
    fetch('/api/text' + SID_Q, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    }).catch(() => {});
  }

  textInput.addEventListener('focus', () => { typing = true; });
  textInput.addEventListener('blur', () => { typing = false; });
  textInput.addEventListener('keydown', (e) => {
    // Enter that commits an input-method candidate must not send the message.
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    sendText();
  });

  // The case card panel, beside the conversation so nobody has to switch tabs
  // mid-interview. Collapsing hides it without tearing down the frame or
  // clearing its source, so a card already filled in survives being closed.
  const SPLIT_MIN_WIDTH = 1081;   // 560 (app) + 460 (panel) + margin

  btnCard.addEventListener('click', () => {
    if (window.innerWidth < SPLIT_MIN_WIDTH) {
      // Too narrow to split; give it its own window.
      window.open('/static/case_card.html', 'casecard',
                  'width=560,height=900,noopener');
      return;
    }
    if (!cardFrame.src) cardFrame.src = '/static/case_card.html';   // load on first use
    document.body.classList.toggle('with-card');
  });

  btnClear.addEventListener('click', async () => {
    // The reset endpoint already turns the mic off server-side and reports the
    // resulting state. Toggling as well would turn it back on, leaving the two
    // sides disagreeing and the next Start doing nothing.
    await fetch('/api/reset' + SID_Q, { method: 'POST' });
    chatState = [];
    chatMessages.innerHTML = '';
    subtitle.textContent = '';
    statusBar.textContent = 'Click Start to begin';
    if (micActive) {
      stopMic();
      micActive = false;
      btnStart.textContent = 'Start';
      btnStart.classList.remove('active');
    }
    disableTextInput();
  });
})();
</script>
</body>
</html>
